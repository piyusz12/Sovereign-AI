version: '3.8'

services:
  backend:
    build: 
      context: ..
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
    volumes:
      - ../data:/app/data
      - ../config:/app/config
    depends_on:
      - qdrant
    network_mode: host  # Required for zero-egress sovereignty monitoring

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  sandbox:
    image: sovereign-sandbox:latest
    command: tail -f /dev/null
    network_mode: none  # Phase 25: Sandbox network strictly disabled
    mem_limit: 512m
    cpus: 1

volumes:
  qdrant_data:
